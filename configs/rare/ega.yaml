includes:
  - base_federated.yaml

experiment:
  name: ega
  mode: federated
  output_dir: outputs/ega

federated:
  algorithm: ega_fedavg
  quantization_seed: 2026

ega:
  # Pretrained codec artifact used by EGA upload transforms.
  artifact_path: artifacts/ega/ega_h240_v1.pt
  block_size: 256
  encoded_dim: 240
  hidden_dim: 1024
  residual_blocks: 2
  quantization_level: 127
  encode_buffers: false
  normalization: 0.00025
  initial_normalization: 0.00025
  min_normalization: 0.000001
  normalization_strategy: ema_reported_client_max_abs
  normalization_ema: 0.9
  encoded_dtype: int8
  encoded_stochastic_rounding: false
  encoded_noise_std: 0.0
  error_feedback: true
  pretrain:
    epochs: 100
    patience: 20
    min_delta: 0.0
    batch_size: 128
    lr: 0.0005
    train_groups: 30000
    val_groups: 15000
    seed: 2026
