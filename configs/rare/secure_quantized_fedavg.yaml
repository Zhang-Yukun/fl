includes:
  - base_federated.yaml

experiment:
  name: secure_quantized_fedavg
  mode: federated
  output_dir: outputs/secure_quantized_fedavg

federated:
  algorithm: secure_quantized_fedavg
  # Typical choices are float16 and qint8.
  quantization_dtype: float16
  quantization_stochastic_rounding: true
  quantization_seed: 2026

privacy:
  # Optional local clipping/noise before dense quantized upload.
  clip_norm: 10.0
  noise_multiplier: 0.0001
