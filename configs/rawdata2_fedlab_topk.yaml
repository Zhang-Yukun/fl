includes: rawdata2_patchtst.yaml

experiment:
  name: rawdata2_fedlab_topk
  mode: federated
  output_dir: outputs/rawdata2_fedlab_topk

federated:
  algorithm: sparse_fedavg
  rounds: 30
  local_epochs: 1
  topk_fraction: 0.05

attack:
  enabled: true
  frequency_rounds: 1
  max_samples: 1
  steps: 300
  lr: 0.05
  success_mse_threshold: 0.0001
  model_mode: eval
  seed: 2026
