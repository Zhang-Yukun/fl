includes:
  - common/rawdata2_patchtst_base.yaml
  - common/federated_sync_300.yaml

experiment:
  name: rawdata2_fedlab_topk
  mode: federated
  output_dir: outputs/rawdata2_fedlab_topk

federated:
  algorithm: sparse_fedavg
  topk_fraction: 0.10

evaluation:
  mode: oracle_full_update

attack:
  reference_metric: nearest_client_train_mse
  client_selection: round_robin
  clients_per_round: 1
