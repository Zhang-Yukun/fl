includes: rawdata2_patchtst.yaml

experiment:
  name: rawdata2_fedlab_topk
  mode: federated
  output_dir: outputs/rawdata2_fedlab_topk

federated:
  algorithm: sparse_fedavg
  rounds: 500
  local_epochs: 1
  topk_fraction: 0.10

attack:
  enabled: true
  frequency_rounds: 5
  max_samples: 1
  steps: 500
  lr: 0.05
  optimizer: adam
  restarts: 1
  lbfgs_history_size: 20
  reference_metric: reconstruction_mse
  client_selection: round_robin
  clients_per_round: 1
  sample_count: 1
  input_clip: 5.0
  target_clip: 5.0
  success_mse_threshold: 1.10
  success_ssim_threshold: 0.3
  success_rate_threshold: 0.03
  data_range: 1.0
  model_mode: eval
  seed: 2026
