experiment:
  name: rawdata2_patchtst
  mode: federated
  output_dir: outputs/rawdata2_patchtst_fedavg

runtime:
  device: cuda:0
  log_level: INFO
  num_threads: 4
  num_interop_threads: 1

data:
  split_dir: ../data/rare_earth_rawdata2
  clients: [Nd2O3, CeO2, La2O3]
  seq_len: 21
  pred_len: 7
  batch_size: 128
  num_workers: 0

model:
  name: patchtst
  channels: 1
  patch_len: 16
  stride: 8
  d_model: 384
  n_heads: 4
  e_layers: 2
  d_ff: 2048
  factor: 3
  activation: gelu
  dropout: 0.1

training:
  lr: 0.001
  epochs: 500
  patience: 50
  min_delta: 0.0

federated:
  algorithm: fedavg
  rounds: 500
  local_epochs: 1
  topk_fraction: 0.05

attack:
  enabled: true
  frequency_rounds: 1
  max_samples: 1
  steps: 300
  lr: 0.05
  success_mse_threshold: 0.01
  success_rate_threshold: 0.03
  data_range: 1.0
  model_mode: eval
  seed: 2026

tracking:
  enabled: false
  offline: true
  project: federated-rare-earth

artifacts:
  config_formats: [yaml, json]

grpc:
  address: 0.0.0.0:50051
  server_address: 127.0.0.1:50051
  poll_seconds: 1.0
