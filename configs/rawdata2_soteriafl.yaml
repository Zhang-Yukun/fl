includes: rawdata2_patchtst.yaml

experiment:
  name: rawdata2_soteriafl
  mode: federated
  output_dir: outputs/rawdata2_soteriafl

federated:
  algorithm: soteriafl
  rounds: 500
  local_epochs: 1
  topk_fraction: 0.05

privacy:
  clip_norm: 1.0
  noise_multiplier: 0.05

attack:
  enabled: true
  frequency_rounds: 1
  max_samples: 1
  steps: 300
  lr: 0.05
  optimizer: adam
  restarts: 1
  lbfgs_history_size: 20
  client_selection: round_robin
  clients_per_round: 1
  sample_count: 1
  input_clip: 5.0
  target_clip: 5.0
  success_ssim_threshold: 0.75
  model_mode: eval
  seed: 2026
