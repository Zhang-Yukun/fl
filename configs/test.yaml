experiment:
  name: test_run
  mode: federated
  output_dir: outputs/test_run

task:
  type: forecasting

data:
  split_dir: ../data/rare_earth_rawdata2
  clients: [Nd2O3, CeO2, La2O3]
  seq_len: 21
  pred_len: 7
  batch_size: 16
  shuffle_train: true
  num_workers: 0

model:
  name: mlp
  channels: 1
  hidden_size: 16
  dropout: 0.1

training:
  epochs: 1
  lr: 0.001
  optimizer: sgd
  patience: 5
  min_delta: 0.0

federated:
  algorithm: fedavg
  rounds: 1
