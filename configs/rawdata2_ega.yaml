includes:
  - common/rawdata2_patchtst_base.yaml
  - common/federated_sync_300.yaml

experiment:
  name: rawdata2_ega
  mode: federated
  output_dir: outputs/rawdata2_ega

federated:
  algorithm: ega_fedavg
  quantization_seed: 2026

evaluation:
  mode: oracle_full_update

ega:
  artifact_path: artifacts/ega/rawdata2_ega_h240_v1.pt
  block_size: 256
  encoded_dim: 240
  hidden_dim: 1024
  residual_blocks: 2
  quantization_level: 127
  encode_buffers: false
  normalization: 0.00025
  initial_normalization: 0.00025
  min_normalization: 0.000001
  normalization_strategy: ema_reported_client_max_abs
  normalization_ema: 0.9
  encoded_dtype: int8
  encoded_stochastic_rounding: false
  encoded_noise_std: 0.0
  download_dtype: int8
  download_method: dense
  download_stochastic_rounding: false
  download_trainable_only: true
  download_encoded_dtype: int8
  error_feedback: true
  pretrain:
    device: cuda:0
    epochs: 100
    patience: 20
    min_delta: 0.0
    batch_size: 128
    lr: 0.0005
    train_groups: 30000
    val_groups: 15000
    seed: 2026
