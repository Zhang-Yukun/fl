includes:
  - common/rawdata2_patchtst_base.yaml
  - common/federated_sync_300.yaml

experiment:
  name: rawdata2_ega
  mode: federated
  output_dir: outputs/rawdata2_ega

federated:
  algorithm: ega_fedavg
  quantization_seed: 2026

evaluation:
  mode: oracle_full_update

ega:
  artifact_path: artifacts/ega/rawdata2_ega.pt
  block_size: 256
  encoded_dim: 128
  hidden_dim: 512
  residual_blocks: 2
  quantization_level: 64
  encode_buffers: false
  normalization: 1.0
  initial_normalization: 1.0
  min_normalization: 0.001
  normalization_strategy: previous_round_max_abs
  pretrain:
    device: cuda:0
    epochs: 30
    patience: 10
    min_delta: 0.5
    batch_size: 64
    lr: 0.001
    train_groups: 10000
    val_groups: 5000
    seed: 2026
