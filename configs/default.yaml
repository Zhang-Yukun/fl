experiment:
  name: rare_earth_three_client
  mode: federated
  output_dir: outputs/rare_earth_three_client

runtime:
  device: cpu
  log_level: INFO

task:
  type: forecasting

data:
  csv_path: ../Time-Series-Prediction/dataset/XT_data/new_train.csv
  clients: [Nd2O3, CeO2, La2O3]
  seq_len: 21
  pred_len: 7
  batch_size: 32
  shuffle_train: true
  train_ratio: 0.7
  val_ratio: 0.15
  num_workers: 0

model:
  name: mlp
  channels: 1
  hidden_size: 64
  dropout: 0.1

training:
  lr: 0.001
  optimizer: sgd
  patience: 5
  min_delta: 0.0

centralized:
  rounds: 10

federated:
  algorithm: fedavg
  rounds: 20
  local_epochs: 1


attack:
  target_type: update_payload
  enabled: true
  reference_metric: nearest_client_train_mse
  report_metrics: [nearest_client_train_mse]
  recovery_match_metric: mse
  recovery_match_objective: auto
  recovery_success_metric: mse
  recovery_success_objective: auto
  steps: 20
  optimizer: adam
  lr: 0.001
  success_mse_threshold: 0.5
  success_rate_threshold: 0.03
  data_range: 1.0
  client_selection: all
  clients_per_round: 3
  async_enabled: false
  async_workers: 1
  async_max_pending_rounds: 5
  device: same

tracking:
  enabled: true
  offline: true
  project: federated-rare-earth


grpc:
  address: 0.0.0.0:50051
  server_address: 127.0.0.1:50051
  poll_seconds: 1.0

artifacts:
  config_formats: [yaml]
  save_every_rounds: 0
