includes: rawdata2_patchtst.yaml

experiment:
  name: rawdata2_fedpetuning
  mode: federated
  output_dir: outputs/rawdata2_fedpetuning

federated:
  algorithm: fedpetuning
  rounds: 500
  local_epochs: 1

model:
  peft:
    enabled: true
    method: fedpetuning
    bottleneck_dim: 32
    dropout: 0.1
    train_head: true
