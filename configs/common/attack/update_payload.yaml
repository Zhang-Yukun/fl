attack:
  # The current framework only supports update_payload.
  target_type: update_payload
  enabled: true
  # Default attack suite; can override to a subset like [dlg] or [idlg].
  methods: [dlg, idlg]
  # Set-recovery matching metric and direction.
  recovery_match_metric: mse
  recovery_match_objective: auto
  # Success metric used after one-to-one matching.
  recovery_success_metric: mse
  recovery_success_objective: auto
  recovery_success_threshold: 0.1
  # Concrete number of samples reconstructed by each attack; "auto" is unsupported.
  max_samples: 128
  steps: 300
  lr: 0.001
  # Attack optimizer supports adam and lbfgs.
  optimizer: adam
  # identity optimizes pixels directly; sigmoid constrains inputs to (0, 1).
  input_parameterization: identity
  restarts: 1
  client_selection: all
  clients_per_round: 3
  input_clip: 5.0
  target_clip: 5.0
  tv_weight: 0.0
  success_rate_threshold: 0.05
  overall_success_rate_threshold: 0.05
  data_range: 1.0
  # train or eval; eval is preferred for deterministic replay with rare-earth configs.
  model_mode: eval
  # Local one-step update approximation used when matching intercepted update_payloads.
  local_optimizer: adam
  local_lr: 0.001
  local_optimizer_eps: 1.0e-8
  # same inherits runtime.device.
  device: same
  seed: 4096
