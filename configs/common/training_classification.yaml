training:
  lr: 0.001
  # Early-stop patience for validation on the primary metric.
  patience: 500
  min_delta: 0.0
  # Classification tasks normally use cross_entropy.
  loss: cross_entropy
  # Supported optimizers: adam, adamw, sgd.
  optimizer: adam
  optimizer_eps: 1.0e-8
  weight_decay: 0.0
  momentum: 0.0
  nesterov: false
