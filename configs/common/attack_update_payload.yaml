attack:
  target_type: update_payload
  enabled: true
  reference_metric: nearest_client_train_mse
  report_metrics: [nearest_client_train_mse]
  frequency_rounds: 5
  max_samples: 1
  steps: 300
  lr: 0.001
  optimizer: adam
  restarts: 1
  lbfgs_history_size: 20
  client_selection: all
  clients_per_round: 3
  sample_count: 1
  input_clip: 5.0
  target_clip: 5.0
  success_mse_threshold: 0.5
  success_ssim_threshold: 0.3
  success_rate_threshold: 0.03
  data_range: 1.0
  model_mode: eval
  seed: 2026
